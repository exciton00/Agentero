name: Windows installer (test build)

# 手动触发的测试打包：只产出 Windows 安装包，不进入 release 流程、不需要任何签名密钥。
# 用法：Actions → 本 workflow → Run workflow → Use workflow from 保持 main，
#       Branch to build 填 feat/mineru-self-hosted。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 兜底：prepare-pdfium.mjs 用 execFileSync("tar") 解包，若 PATH 上是 Git Bash 的
      # GNU tar，`C:\...` 会被当成远端主机（Cannot connect to C:）。这里用 Windows 自带的
      # bsdtar 预解包，并用 PDFIUM_LIB_PATH / PDFIUM_INCLUDE_PATH 让 pdfium:stage 与
      # liteparse-pdfium-sys 的 build.rs 直接命中，跳过下载与 tar。
      - name: Stage PDFium (System32 bsdtar)
        shell: pwsh
        run: |
          $asset = "pdfium-win-x64"
          $url = "https://github.com/run-llama/pdfium-binaries/releases/download/chromium%2F7897/$asset.tgz"
          $dir = Join-Path $env:RUNNER_TEMP "pdfium"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $tgz = Join-Path $env:RUNNER_TEMP "pdfium.tgz"
          Invoke-WebRequest -Uri $url -OutFile $tgz
          & "$env:SystemRoot\System32\tar.exe" -xzf $tgz -C $dir
          if (-not (Test-Path "$dir\bin\pdfium.dll")) { throw "pdfium.dll not found in $dir\bin" }
          if (-not (Test-Path "$dir\include")) { throw "pdfium include dir not found in $dir" }
          "PDFIUM_LIB_PATH=$dir\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PDFIUM_INCLUDE_PATH=$dir\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # release.yml 会带 TAURI_SIGNING_PRIVATE_KEY 生成 updater 签名；测试包不需要，
      # 这里用临时配置文件关掉 createUpdaterArtifacts（写成文件，避免 PowerShell 引号转义问题）。
      - name: Build installers
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP "tauri.test.conf.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' | Out-File -FilePath $cfg -Encoding utf8
          pnpm tauri build --config $cfg

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: agentero-windows-installer
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
