name: Windows installer (test build)

# 手动触发的测试打包：只产出 Windows 安装包，不进入 release 流程、不需要任何签名密钥。
# 用法：Actions → 本 workflow → Run workflow → 选择要构建的分支。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # release.yml 会带 TAURI_SIGNING_PRIVATE_KEY 生成 updater 签名；测试包不需要，
      # 这里直接关掉 createUpdaterArtifacts，避免依赖仓库 secret。
      - name: Build installers
        shell: bash
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: agentero-windows-installer
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
